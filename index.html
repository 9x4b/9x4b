<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9x4b</title>
<meta name="description" content="9x4b">
<style>
  :root {
    --glow: #cfeff0;
    --glow-soft: rgba(160, 225, 230, .55);
    --card: rgba(18, 26, 30, .62);
    --line: rgba(255, 255, 255, .07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--glow);
    background: #05090b;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  /* soft moving green/teal haze */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .bg i {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .bg i:nth-child(1) { width: 420px; height: 420px; background: #0f3a38; top: -120px; left: -80px; }
  .bg i:nth-child(2) { width: 380px; height: 380px; background: #123a2a; bottom: -140px; right: -60px; animation-delay: -6s; }
  .bg i:nth-child(3) { width: 300px; height: 300px; background: #0e2a40; top: 40%; left: 55%; animation-delay: -11s; }
  @keyframes drift { to { transform: translate(50px, 40px) scale(1.15); } }
  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  main {
    position: relative; z-index: 2;
    width: min(420px, 92vw);
    padding: 34px 22px 26px;
    text-align: center;
    background: linear-gradient(180deg, rgba(10,16,19,.55), rgba(10,16,19,.25));
    border: 1px solid var(--line);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .avatar {
    width: 116px; height: 116px; border-radius: 50%;
    margin: 0 auto 18px;
    display: block; object-fit: cover;
    border: 2px solid rgba(255,255,255,.08);
    box-shadow: 0 0 30px rgba(150, 220, 225, .18);
    background: #0b1215;
  }
  h1 {
    font-size: 2.3rem; font-weight: 600; letter-spacing: .01em;
    text-shadow: 0 0 10px var(--glow-soft), 0 0 28px rgba(140, 215, 220, .35);
  }
  .bio {
    margin-top: 10px; font-size: 1rem; font-weight: 500;
    text-shadow: 0 0 10px rgba(160,225,230,.25);
  }

  .status {
    margin: 26px 0 24px;
    display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .status .pfp { position: relative; flex: none; width: 46px; height: 46px; }
  .status .pfp img, .status .pfp .ph {
    width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: #0b1215;
  }
  .status .dot {
    position: absolute; right: -2px; bottom: -2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #3ba55d; border: 3px solid #141d21;
  }
  .status .name { font-weight: 600; font-size: 1rem; }
  .status .sub { margin-top: 3px; font-size: .82rem; color: rgba(207,239,240,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }

  .links { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .links a {
    width: 46px; height: 46px; display: grid; place-items: center;
    color: var(--glow);
    border-radius: 14px;
    transition: transform .18s ease, background .18s ease;
    filter: drop-shadow(0 0 8px rgba(160,225,230,.55));
  }
  .links a:hover { transform: translateY(-3px) scale(1.08); background: rgba(255,255,255,.05); }
  .links svg { width: 30px; height: 30px; fill: currentColor; }

  .views {
    margin-top: 26px; display: inline-flex; align-items: center; gap: 8px;
    font-size: .95rem; color: rgba(207,239,240,.8);
  }
  .views svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="grain"></div>

<main>
  <!-- Put your picture next to this file as avatar.jpg (or change the src). Falls back to a placeholder. -->
  <img class="avatar" id="avatar" src="avatar.jpg" alt="9x4b"
       onerror="this.onerror=null;this.src=fallback(116)">

  <h1>9x4b</h1>
  <p class="bio">your bio goes here</p>

  <div class="status">
    <div class="pfp">
      <img id="avatar2" src="avatar.jpg" alt="" onerror="this.onerror=null;this.src=fallback(46)">
      <span class="dot"></span>
    </div>
    <div>
      <div class="name">9x4b</div>
      <div class="sub">edit this line with whatever you want</div>
    </div>
  </div>

  <nav class="links">
    <!-- Spotify: replace # with your profile link -->
    <a href="#" aria-label="Spotify" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21zm0 2a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17zM7 9.3c3.5-1 7.2-.7 10.4 1a.9.9 0 0 0 .9-1.6c-3.6-1.9-7.8-2.300-11.800-1.100A.9.9 0 0 0 7 9.300zm.5 3.200c3-.8 6-.5 8.700 1a.8.8 0 0 0 .8-1.400c-3.100-1.700-6.500-2-9.900-1.100a.8.8 0 1 0 .4 1.500zm.5 3c2.400-.6 4.700-.4 6.700.8a.7.7 0 0 0 .7-1.200c-2.400-1.400-5-1.700-7.800-1a.7.7 0 0 0 .4 1.400z"/></svg>
    </a>
    <!-- Roblox: replace # with your profile link -->
    <a href="#" aria-label="Roblox" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M6.2 2.500 21.500 6.200 17.800 21.500 2.500 17.800zM10.600 10.600l-.8 3.200 3.200.8.8-3.200z"/></svg>
    </a>
    <!-- Discord: opens your profile by user ID -->
    <a href="https://discord.com/users/1235531970839187547" aria-label="Discord" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19.300 5.400A17 17 0 0 0 15.100 4l-.5 1a15.800 15.800 0 0 0-5.200 0l-.5-1a17 17 0 0 0-4.200 1.400C1.900 9.400 1.200 13.300 1.500 17.100a17 17 0 0 0 5.200 2.600l1.100-1.800c-.6-.2-1.200-.5-1.700-.9l.4-.3a12 12 0 0 0 10.600 0l.4.300c-.5.400-1.100.700-1.700.9l1.100 1.800a17 17 0 0 0 5.200-2.600c.4-4.400-.7-8.300-3.200-11.700zM8.700 14.800c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm6.600 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/></svg>
    </a>
    <!-- TikTok: replace # with your profile link -->
    <a href="#" aria-label="TikTok" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M14 2h3a5 5 0 0 0 4 4.600v3.100a8 8 0 0 1-4-1.200v6.500a6.500 6.500 0 1 1-6.500-6.500c.3 0 .7 0 1 .1v3.200a3.300 3.300 0 1 0 2.500 3.200z"/></svg>
    </a>
    <!-- Website: replace # with your link -->
    <a href="#" aria-label="Website" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.900 9h-3a15 15 0 0 0-1.200-5.200A8 8 0 0 1 18.900 11zM12 4c.8 1 1.600 3.100 1.900 7h-3.800C10.400 7.100 11.200 5 12 4zM4 13h3a15 15 0 0 0 1.200 5.200A8 8 0 0 1 4 13zm3-2H4.100a8 8 0 0 1 4.700-5.200A15 15 0 0 0 7 11zm5 9c-.8-1-1.600-3.100-1.900-7h3.800c-.3 3.900-1.100 6-1.900 7zm3.200-1.800A15 15 0 0 0 16.400 13h2.500a8 8 0 0 1-3.700 5.200z"/></svg>
    </a>
  </nav>

  <div class="views" title="Total views">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <span id="count">0</span>
  </div>
</main>

<script>
  // Placeholder avatar (first letter of the name) if avatar.jpg is missing
  function fallback(size) {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'>
      <rect width='100%' height='100%' fill='#0f1a1e'/>
      <text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle'
        font-family='sans-serif' font-size='${size * .45}' fill='#cfeff0'>9</text></svg>`;
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  // View counter: counts once per browser session, always shows the saved total
  (async () => {
    const el = document.getElementById("count");
    let counted = false;
    try { counted = sessionStorage.getItem("viewed") === "1"; } catch (e) {}
    try {
      const r = await fetch("/api/views" + (counted ? "?peek=1" : ""), { method: "POST" });
      const d = await r.json();
      el.textContent = Number(d.views).toLocaleString();
      try { sessionStorage.setItem("viewed", "1"); } catch (e) {}
    } catch (e) { /* function not deployed yet: leave it at 0 */ }
  })();
</script>
</body>
</html>
